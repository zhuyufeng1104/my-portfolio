name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Keep an active production deployment intact while later builds queue.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Export static site
        run: npm run build
        env:
          PORTFOLIO_STATIC_EXPORT: "1"
          PORTFOLIO_BASE_PATH: /my-portfolio
      - run: npm run typecheck
      - name: Check exported routes and asset paths
        run: node scripts/check-static-export.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    # PRs and manual runs on other branches must never enter the protected environment.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published pages and assets
        env:
          PREVIEW_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          site_url="${PREVIEW_URL%/}/"
          curl --fail --retry 8 --retry-delay 10 --retry-all-errors "$site_url" -o /tmp/home.html
          grep -q 'BEYOND' /tmp/home.html
          curl --fail --retry 3 --retry-delay 5 --retry-all-errors "${site_url}works/" -o /tmp/works.html
          grep -q 'SELECTED' /tmp/works.html
          curl --fail --retry 3 --retry-delay 5 --retry-all-errors "${site_url}projects/afterlight/" -o /tmp/project.html
          grep -q 'AFTERLIGHT' /tmp/project.html
          curl --fail --retry 3 --retry-delay 5 --retry-all-errors "${site_url}images/hero.svg" -o /tmp/hero.svg
          grep -q '<svg' /tmp/hero.svg
