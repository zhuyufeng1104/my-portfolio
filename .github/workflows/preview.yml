name: Portfolio preview
on:
  push:
    branches: [feat/portfolio-review]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: portfolio-pages
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          PORTFOLIO_STATIC_EXPORT: "1"
          PORTFOLIO_BASE_PATH: /my-portfolio
      - run: npm run typecheck
      - name: Check Pages availability
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" --silent; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Preview build succeeded. Enable GitHub Pages with GitHub Actions as the source in repository settings, then rerun this workflow to publish.'
          fi
      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.ready == 'true'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - name: Publish preview
        id: deployment
        if: steps.pages.outputs.ready == 'true'
        uses: actions/deploy-pages@v4
      - name: Verify public preview
        if: steps.pages.outputs.ready == 'true'
        env:
          PREVIEW_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --retry 8 --retry-delay 10 --retry-all-errors "$PREVIEW_URL" -o /tmp/home.html
          grep -q 'BEYOND' /tmp/home.html
          curl --fail --retry 3 --retry-delay 5 "${PREVIEW_URL}works/" -o /tmp/works.html
          grep -q 'SELECTED' /tmp/works.html
          curl --fail "${PREVIEW_URL}projects/afterlight/" -o /tmp/project.html
          grep -q 'AFTERLIGHT' /tmp/project.html
